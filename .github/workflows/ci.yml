name: Prostate Biopsy Gleason Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: ci-test-only-not-for-production
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . fastapi uvicorn pydantic pytest

    - name: Validate Python sources
      run: python -m compileall -q agents prostate_biopsy_gleason_agent cli.py prostate_gleason.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Grade Group JavaScript regression check
      run: node web/test_grading.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
