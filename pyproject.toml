[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prostate-biopsy-gleason-engine"
version = "2.0.0"
description = "ProstateBiopsy Gleason Sentinel: Autonomous Multi-Core ISUP Grade Grouping & Perineural Tracker"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
prostate-biopsy-gleason-engine = "prostate_biopsy_gleason_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/prostate-biopsy-gleason-engine"
Repository = "https://github.com/abusuraihsakhri/prostate-biopsy-gleason-engine.git"
